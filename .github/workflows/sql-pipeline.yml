name: SQL CI/CD Pipeline

on:
  push:
    branches:
      - dev
    paths:
      - '**.sql'
  pull_request:
    branches:
      - dev
    paths:
      - '**.sql'

jobs:
  validate-and-deploy:
    name: Validate & Deploy SQL
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed SQL files
        id: changed-files
        shell: powershell
        run: |
          $base = "${{ github.event.before }}"
          $head = "${{ github.sha }}"
          $files = git diff --name-only $base $head -- '*.sql'
          $fileList = $files -join " "
          echo "files=$fileList" >> $env:GITHUB_OUTPUT
          Write-Host "Changed SQL files: $fileList"

      - name: Run SQL scripts
        id: run-sql
        shell: powershell
        run: |
          $sqlFiles = "${{ steps.changed-files.outputs.files }}" -split " " | Where-Object { $_ -ne "" }
          $errors = ""
          $successFiles = ""

          if ($sqlFiles.Count -eq 0) {
            Write-Host "No SQL files changed. Skipping."
            echo "status=skipped" >> $env:GITHUB_OUTPUT
            exit 0
          }

          foreach ($file in $sqlFiles) {
            if (-not (Test-Path $file)) {
              Write-Host "File not found: $file"
              continue
            }
            Write-Host "Running: $file"
	    $output = & sqlplus -S "dev_user/Welcome123@localhost:1521/FREEPDB1" "@$file" 2>&1            
            $output = $output -join "`n"
            Write-Host $output

            if ($output -match "ORA-|SP2-0|ERROR") {
              $errors += "FAILED: $file`n$output`n"
            } else {
              $successFiles += "SUCCESS: $file`n"
              Write-Host "SUCCESS: $file"
            }
          }

          echo "errors<<EOF" >> $env:GITHUB_OUTPUT
          echo "$errors" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
          echo "success_files<<EOF" >> $env:GITHUB_OUTPUT
          echo "$successFiles" >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT

          if ($errors -ne "") {
            echo "status=failure" >> $env:GITHUB_OUTPUT
            exit 1
          } else {
            echo "status=success" >> $env:GITHUB_OUTPUT
          }

      - name: Post success comment
        if: steps.run-sql.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const successFiles = `${{ steps.run-sql.outputs.success_files }}`;
            const sha = context.sha.substring(0, 7);
            const body = [
              `## ✅ SQL Pipeline — Passed`,
              `**Commit:** \`${sha}\``,
              `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
              `### Files executed successfully:`,
              successFiles,
              `> Oracle DB updated. Triggering merge to \`uat\`...`
            ].join('\n');
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha, body
              });
            }

      - name: Post failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const errors = `${{ steps.run-sql.outputs.errors }}`;
            const sha = context.sha.substring(0, 7);
            const body = [
              `## ❌ SQL Pipeline — Failed`,
              `**Commit:** \`${sha}\``,
              `**Branch:** \`${context.ref.replace('refs/heads/', '')}\``,
              `### Errors found:`,
              errors,
              `> ⚠️ Database was NOT updated. Fix the errors and push again.`
            ].join('\n');
            if (context.payload.pull_request) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.payload.pull_request.number, body
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner, repo: context.repo.repo,
                commit_sha: context.sha, body
              });
            }

  merge-to-uat:
    name: Merge dev to uat
    runs-on: self-hosted
    needs: validate-and-deploy
    if: success() && github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge dev into uat
        id: merge
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout uat
          git merge origin/dev --no-ff -m "chore: auto-merge dev to uat [skip ci]"
          git push origin uat
          echo "status=success" >> $env:GITHUB_OUTPUT

      - name: Post merge success comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner, repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## 🔀 Merge Successful — \`dev\` → \`uat\`\n\nSQL validation passed and \`uat\` has been automatically updated.`
            });

      - name: Post merge failure comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner, repo: context.repo.repo,
              commit_sha: context.sha,
              body: `## ⚠️ Merge Failed — \`dev\` → \`uat\`\n\nSQL passed but auto-merge failed. Please merge manually.`
            });